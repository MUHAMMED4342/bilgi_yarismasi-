async function load(){
  try {
    const r = await fetch("questions.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const list = d.questions || d;
    if (!Array.isArray(list) || list.length < 10) {
      throw new Error("questions.json en az 10 soru içermeli. Bulunan: " + (Array.isArray(list)?list.length:0));
    }
    POOL = list.map(q => [q.category, q.question, q.options, q.answer, q.explanation || ""]);
    console.log("questions.json yüklendi:", POOL.length, "soru");
  } catch (err) {
    console.error("questions.json yüklenemedi:", err);
    st.innerHTML = `<h1>Sorular yüklenemedi</h1>
      <p class="muted">questions.json dosyası okunamadı veya eksik. Hata: ${escapeHtml(err.message||String(err))}</p>

      <button class="btn" id="retry">Tekrar Dene</button>`;
    const b = document.getElementById("retry");
    if (b) b.onclick = () => location.reload();
  }
}

/* ===== SES MOTORU (yüksek ses, özgün) ===== */
let ac=null,on=true;
function ctx(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==="suspended")ac.resume();return ac}

/* Master gain ile genel ses seviyesi yükseltildi */
function masterGain(){
  const c=ctx(); if(!c) return null;
  if(!masterGain._g){
    const g=c.createGain(); g.gain.value=1.6; g.connect(c.destination); masterGain._g=g;
  }
  return masterGain._g;
}

function envTone(f,t,d,type="sine",v=.35,f2,filter){
  const c=ctx(); if(!c||!on) return;
  const mg=masterGain(); if(!mg) return;
  const o=c.createOscillator(),g=c.createGain(),n=c.currentTime+t;
  o.type=type; o.frequency.setValueAtTime(f,n);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,n+d);
  g.gain.setValueAtTime(0,n);
  g.gain.linearRampToValueAtTime(v,n+.012);
  g.gain.exponentialRampToValueAtTime(.0001,n+d);
  let node=o;
  if(filter){const fl=c.createBiquadFilter();fl.type=filter.type||"lowpass";fl.frequency.value=filter.freq||1200;fl.Q.value=filter.q||1;o.connect(fl);node=fl}
  node.connect(g).connect(mg);
  o.start(n); o.stop(n+d+.05);
}
function noise(t,d,v=.25,hp=800){
  const c=ctx(); if(!c||!on) return;
  const mg=masterGain(); if(!mg) return;
  const len=Math.ceil(c.sampleRate*d),buf=c.createBuffer(1,len,c.sampleRate),data=buf.getChannelData(0);
  for(let i=0;i<len;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
  const g=c.createGain(); g.gain.value=v;
  src.connect(f).connect(g).connect(mg); src.start(c.currentTime+t);
}

const S={

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function buildQuestions(n){
  if(!POOL || POOL.length < 10) throw new Error("Soru havuzu yetersiz.");
  const count = Math.min(n||10, POOL.length);
  return shuf(POOL).slice(0, count).map(q=>{
    const o = q[2].map((t,i)=>({t, c: i === q[3]}));
    return { cat: q[0], q: q[1], o: shuf(o), e: q[4] || "" };
  });
}

/* ===== ÇEVRİMİÇİ TAŞIYICI: MQTT (WebSocket) =====
   Python uygulamasıyla aynı kanalı ve aynı ileti biçimini kullanır, böylece
   web ve masaüstü oyuncular birbiriyle eşleşir. Ek kütüphane gerekmez. */
const MQ_PREFIX="bilgiarena-py/v1",MQ_LOBBY=MQ_PREFIX+"/lobby",MQ_CH=MQ_PREFIX+"/ch/";
const MQ_BROKERS=[
  {fam:0,url:"wss://broker.emqx.io:8084/mqtt"},
  {fam:1,url:"wss://broker.hivemq.com:8884/mqtt"}
];
const MQ_T={seek:1600,offerRefresh:4000,joinRandom:6000,joinRoom:8000,ping:3000,lost:15000};
const _mqEnc=new TextEncoder(),_mqDec=new TextDecoder();
function mqHex(n){let s="";while(s.length<n)s+=Math.floor(Math.random()*16).toString(16);return s}
function mqStr(s){const b=typeof s==="string"?_mqEnc.encode(s):s;const o=new Uint8Array(2+b.length);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o}
function mqCat(...a){let n=0;a.forEach(x=>n+=x.length);const o=new Uint8Array(n);let p=0;a.forEach(x=>{o.set(x,p);p+=x.length});return o}
function mqLen(n){const o=[];do{let b=n%128;n=Math.floor(n/128);if(n)b|=128;o.push(b)}while(n);return Uint8Array.from(o)}
function mqPkt(hdr,body){return mqCat(Uint8Array.of(hdr),mqLen(body.length),body)}
const mqSleep=ms=>new Promise(r=>setTimeout(r,ms));

class MiniMqtt{
  constructor(onMessage){
    this.onMessage=onMessage;this.ws=null;this.topics=new Set();this.pid=0;this.closing=false;
    this.buf=new Uint8Array(0);this.pinger=null;this.will=null;this.url=null;this.cid="by-"+mqHex(12);
  }
  async connect(url,will,timeout){
    this.url=url;this.will=will;
    await this._open(timeout);
    this._afterOpen();
  }
  _open(timeout){
    return new Promise((res,rej)=>{
      let done=false;
      const ws=new WebSocket(this.url,"mqtt");ws.binaryType="arraybuffer";
      let t=null;
      const fail=m=>{if(done)return;done=true;clearTimeout(t);try{ws.close()}catch(e){}rej(new Error(m))};
      t=setTimeout(()=>fail("zaman aşımı"),timeout);
      ws.onopen=()=>{try{ws.send(this._connectPkt())}catch(e){fail("gönderilemedi")}};
      ws.onerror=()=>fail("bağlantı hatası");
      ws.onclose=()=>{if(!done)fail("bağlantı kapandı");else if(this.ws===ws&&!this.closing)this._lost()};
      ws.onmessage=ev=>{
        if(done)return;
        const d=new Uint8Array(ev.data);
        if(d.length>=4&&(d[0]>>4)===2){
          if(d[3]===0){
            done=true;clearTimeout(t);this.ws=ws;this.buf=new Uint8Array(0);
            ws.onmessage=e=>this._feed(new Uint8Array(e.data));
            res();
            if(d.length>4)this._feed(d.subarray(4));
          }else fail("sunucu reddetti ("+d[3]+")");
        }
      };
    });
  }
  _connectPkt(){
    let flags=0x02,pl=mqStr(this.cid);
    if(this.will){flags|=0x0C;pl=mqCat(pl,mqStr(this.will.topic),mqStr(this.will.payload))}
    const body=mqCat(mqStr("MQTT"),Uint8Array.of(4,flags,0,60),pl);
    return mqPkt(0x10,body);
  }
  _afterOpen(){
    this.topics.forEach(t=>this._sendSub(t));
    clearInterval(this.pinger);
    this.pinger=setInterval(()=>this._send(Uint8Array.of(0xC0,0)),20000);
  }
  _lost(){
    clearInterval(this.pinger);this.ws=null;
    (async()=>{
      while(!this.closing){
        await mqSleep(2000);
        if(this.closing)return;
        try{await this._open(6000);this._afterOpen();return}catch(e){}
      }
    })();
  }
  _send(u8){try{if(this.ws&&this.ws.readyState===1){this.ws.send(u8);return true}}catch(e){}return false}
  _pidn(){this.pid=this.pid%65535+1;return Uint8Array.of(this.pid>>8,this.pid&255)}
  _sendSub(t){this._send(mqPkt(0x82,mqCat(this._pidn(),mqStr(t),Uint8Array.of(1))))}
  subscribe(t){this.topics.add(t);this._sendSub(t)}
  unsubscribe(t){this.topics.delete(t);this._send(mqPkt(0xA2,mqCat(this._pidn(),mqStr(t))))}
  publish(topic,text,retain){
    this._send(mqPkt(0x32|(retain?1:0),mqCat(mqStr(topic),this._pidn(),_mqEnc.encode(text||""))));
  }
  _feed(bytes){
    this.buf=mqCat(this.buf,bytes);
    for(;;){
      const b=this.buf;if(b.length<2)return;
      let mult=1,len=0,i=1,ok=false;
      for(;i<=4&&i<b.length;i++){
        const d=b[i];len+=(d&127)*mult;mult*=128;
        if(!(d&128)){ok=true;i++;break}
      }
      if(!ok||b.length<i+len)return;
      const hdr=b[0],body=b.subarray(i,i+len);
      this.buf=b.subarray(i+len);
      try{this._handle(hdr,body)}catch(e){}
    }
  }
  _handle(hdr,body){
    if((hdr>>4)!==3)return;
    const qos=(hdr>>1)&3,retain=!!(hdr&1);
    const tl=(body[0]<<8)|body[1];
    const topic=_mqDec.decode(body.subarray(2,2+tl));
    let idx=2+tl;
    if(qos){
      const pid=body.subarray(idx,idx+2);idx+=2;
      if(qos===1)this._send(Uint8Array.of(0x40,2,pid[0],pid[1]));
    }
    this.onMessage(topic,_mqDec.decode(body.subarray(idx)),retain);
  }
  disconnect(){
    this.closing=true;clearInterval(this.pinger);
    this._send(Uint8Array.of(0xE0,0));
    const w=this.ws;this.ws=null;
    setTimeout(()=>{try{w&&w.close()}catch(e){}},300);
  }
}

/* Eşleşme, el sıkışma, kalp atışı ve mesajlaşma (online.py içindeki Session ile aynı iş akışı).
   emit(olay, veri): status | room_ready | error | matched | msg | left */
class MqSession{
  constructor(name,emit){
    this.name=(name||"Oyuncu").slice(0,20);this.emit=emit;this.id=mqHex(10);
    this.mq=null;this.state="idle";this.random=false;this.channel=null;this.opp=null;
    this.oppName="Rakip";this.isHost=false;this.seq=0;this.seen={};this.lastSeen=0;this.nextPing=0;
    this.offer=null;this.seekDeadline=0;this.helloDeadline=0;this.nextOffer=0;
    this.joinFromLobby=false;this.leftSent=false;this.closed=false;this.fam=null;this.timer=null;
  }
  get matched(){return this.state==="matched"}
  startRandom(){this.random=true;this._boot(()=>this._bootRandom())}
  hostRoom(){this.random=false;this._boot(()=>this._bootRoom())}
  joinRoom(code){this.random=false;this._boot(()=>this._bootJoin(code))}
  send(d){
    if(this.state!=="matched"||!this.channel)return false;
    this._pub(this.channel,Object.assign({},d,{to:this.opp}));return true;
  }
  close(){
    if(this.closed)return;
    this.closed=true;
    const prev=this.state,mq=this.mq;
    clearInterval(this.timer);
    if(mq){
      try{
        if(prev==="matched"&&this.channel)this._pub(this.channel,{t:"bye",to:this.opp});
        if((prev==="hosting"||prev==="seeking")&&this.random)mq.publish(MQ_LOBBY,"",true);
      }catch(e){}
    }
    this.state="closed";
    if(mq)mq.disconnect();
  }
  destroy(){this.close()}

  _boot(fn){
    fn().catch(e=>{
      if(this.closed)return;
      this.emit("error",{text:"Çevrimiçi sunucuya bağlanılamadı. İnternet bağlantını kontrol edip tekrar dene. ("+(e&&e.message||e)+")"});
    });
  }
  async _connect(pref){
    this.emit("status",{text:"Sunucuya bağlanılıyor…"});
    let list=MQ_BROKERS.filter(b=>pref!=null&&b.fam===pref);
    if(!list.length)list=MQ_BROKERS;
    const will={topic:MQ_PREFIX+"/presence/"+this.id,payload:JSON.stringify({t:"gone",from:this.id})};
    let last="";
    for(let i=0;i<list.length;i++){
      if(this.closed)return false;
      if(list.length>1)this.emit("status",{text:"Sunucuya bağlanılıyor ("+(i+1)+"/"+list.length+")…"});
      const mq=new MiniMqtt((t,p,r)=>this._onMessage(t,p,r));
      try{
        await mq.connect(list[i].url,will,5000);
        if(this.closed){mq.disconnect();return false}
        this.mq=mq;this.fam=list[i].fam;
        this.timer=setInterval(()=>this._tick(),250);
        return true;
      }catch(e){last=list[i].url.split("/")[2]+": "+(e&&e.message||e)}
    }
    throw new Error(last||"bağlanılamadı");
  }
  async _bootRandom(){
    if(!(await this._connect(null)))return;
    this.state="seeking";this.seekDeadline=Date.now()+MQ_T.seek;
    this.mq.subscribe(MQ_LOBBY);
    this.emit("status",{text:"Rakip aranıyor… Havuzda bekleyen biri varsa eşleşeceksiniz."});
  }
  async _bootRoom(){
    if(!(await this._connect(null)))return;
    const code=String(this.fam==null?9:this.fam)+String(Math.floor(Math.random()*100000)).padStart(5,"0");
    this.channel=MQ_CH+"room-"+code;this.state="hosting";this.isHost=true;
    this.mq.subscribe(this.channel);
    this.emit("room_ready",{code});
  }
  async _bootJoin(code){
    code=String(code||"").trim();
    const pref=/^\d/.test(code)?parseInt(code[0],10):null;
    if(!(await this._connect(pref)))return;
    this.channel=MQ_CH+"room-"+code;this.joinFromLobby=false;
    this.mq.subscribe(this.channel);
    this._startJoining(null,MQ_T.joinRoom);
    this.emit("status",{text:"Odaya bağlanılıyor…"});
  }
  _startJoining(hostId,wait){
    this.state="joining";this.helloDeadline=Date.now()+wait;
    this._pub(this.channel,{t:"join",name:this.name,to:hostId});
  }
  _pub(topic,d,retain){
    const o=Object.assign({},d,{from:this.id,n:this.seq++});
    this.mq.publish(topic,JSON.stringify(o),!!retain);
  }

  _onMessage(topic,text,retained){
    if(!text||this.closed)return;
    let d;try{d=JSON.parse(text)}catch(e){return}
    if(!d||typeof d!=="object"||Array.isArray(d))return;
    if(topic===MQ_LOBBY)this._onLobby(d);
    else if(topic.startsWith(MQ_PREFIX+"/presence/")){
      if(this.state==="matched"&&topic.endsWith("/"+this.opp))this._oppLeft();
    }else if(topic===this.channel)this._onChannel(d);
  }
  _onLobby(d){
    if(d.t!=="wait"||d.id===this.id)return;
    if(typeof d.ch!=="string"||typeof d.id!=="string"||!d.ch.startsWith(MQ_CH))return;
    if(this.state==="seeking")this.offer=d;
    else if(this.state==="hosting"&&this.random&&d.id<this.id)this._switchTo(d);
  }
  _switchTo(offer){
    const old=this.channel;
    this.channel=offer.ch;this.isHost=false;this.joinFromLobby=true;
    this.mq.subscribe(this.channel);
    if(old&&old!==this.channel)this.mq.unsubscribe(old);
    this._startJoining(offer.id,MQ_T.joinRandom);
    this.emit("status",{text:"Rakip bulundu, bağlanılıyor…"});
  }
  _becomeHostRandom(){
    this.channel=MQ_CH+"rnd-"+this.id;this.isHost=true;this.state="hosting";
    this.mq.subscribe(this.channel);this._publishOffer();
    this.emit("status",{text:"Rakip aranıyor… Biri katılınca oyun başlayacak."});
  }
  _publishOffer(){
    this.nextOffer=Date.now()+MQ_T.offerRefresh;
    this._pub(MQ_LOBBY,{t:"wait",id:this.id,ch:this.channel,name:this.name},true);
  }
  _onChannel(d){
    const sender=d.from;
    if(typeof sender!=="string"||sender===this.id)return;
    if(Number.isInteger(d.n)){
      const seen=this.seen[sender]||(this.seen[sender]=[]);
      if(seen.includes(d.n))return;
      seen.push(d.n);if(seen.length>300)seen.splice(0,seen.length-300);
    }
    const t=d.t;
    if(this.state==="hosting"&&t==="join")this._acceptGuest(sender,d);
    else if(this.state==="joining"&&t==="hello"&&d.to===this.id)this._acceptHost(sender,d);
    else if(this.state==="joining"&&t==="full"&&d.to===this.id){this.state="closed";this.emit("error",{text:"Oda dolu."})}
    else if(this.state==="matched"){
      if(t==="join"&&sender!==this.opp)this._pub(this.channel,{t:"full",to:sender});
      else if(sender===this.opp){
        this.lastSeen=Date.now();
        if(t==="bye")this._oppLeft();
        else if(t==="ping"){}
        else if(t==="join")this._pub(this.channel,{t:"hello",to:sender,name:this.name});
        else if(d.to==null||d.to===this.id)this.emit("msg",{data:d});
      }
    }
  }
  _acceptGuest(sender,d){
    const target=d.to;
    if(target!=null&&target!==this.id)return;
    this.opp=sender;this.oppName=String(d.name||"Rakip").slice(0,20);
    this._pub(this.channel,{t:"hello",to:sender,name:this.name});
    if(this.random){this.mq.publish(MQ_LOBBY,"",true);this.mq.unsubscribe(MQ_LOBBY)}
    this._matched("host");
  }
  _acceptHost(sender,d){
    this.opp=sender;this.oppName=String(d.name||"Rakip").slice(0,20);
    if(this.joinFromLobby)this.mq.unsubscribe(MQ_LOBBY);
    this._matched("guest");
  }
  _matched(role){
    this.state="matched";this.isHost=role==="host";
    this.lastSeen=Date.now();this.nextPing=this.lastSeen+MQ_T.ping;
    this.mq.subscribe(MQ_PREFIX+"/presence/"+this.opp);
    this.emit("matched",{role,oppName:this.oppName});
  }
  _oppLeft(){
    if(this.leftSent)return;
    this.leftSent=true;this.emit("left",{});
  }
  _tick(){
    if(this.closed)return;
    const now=Date.now(),st=this.state;
    try{
      if(st==="seeking"&&now>=this.seekDeadline){
        if(this.offer){
          const o=this.offer;this.offer=null;
          this.joinFromLobby=true;this.channel=o.ch;this.isHost=false;
          this.mq.subscribe(this.channel);
          this._startJoining(o.id,MQ_T.joinRandom);
          this.emit("status",{text:"Rakip bulundu, bağlanılıyor…"});
        }else this._becomeHostRandom();
      }else if(st==="hosting"&&this.random&&now>=this.nextOffer)this._publishOffer();
      else if(st==="joining"&&now>=this.helloDeadline){
        if(this.joinFromLobby){
          this.mq.publish(MQ_LOBBY,"",true);
          const old=this.channel;this.joinFromLobby=false;
          this._becomeHostRandom();
          if(old&&old!==this.channel)this.mq.unsubscribe(old);
        }else{
          this.state="closed";this.emit("error",{text:"Oda bulunamadı veya kod yanlış."});
        }
      }else if(st==="matched"){
        if(now>=this.nextPing){this.nextPing=now+MQ_T.ping;this._pub(this.channel,{t:"ping",to:this.opp})}
        if(now-this.lastSeen>MQ_T.lost)this._oppLeft();
      }
    }catch(e){}
  }
}

function stopWaiting(){

  waitingNodes=[];
}

/* Bağlanma sesi: rakip aranırken ya da oda beklenirken yaklaşık 2 saniyede bir
   tekrarlanan yumuşak, yükselen iki notalı "ding-dong". Müzik değil, arama tonu gibi. */
function waitingMusic(){
  stopWaiting();
  const c=ctx(); if(!c||!on) return;
  const mg=masterGain(); if(!mg) return;
  const master=c.createGain(); master.gain.value=0.9; master.connect(mg);
  waitingNodes.push(master);
  function bell(f,t,v){
    [[f,v],[f*2,v*0.25]].forEach(([fr,vol])=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type="sine";o.frequency.value=fr;
      g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
      o.connect(g).connect(master);o.start(t);o.stop(t+0.6);
    });
  }
  const ping=()=>{
    const t=c.currentTime+0.02;
    bell(659.25,t,0.32);          // Mi
    bell(987.77,t+0.2,0.32);      // Si (yükselen)
    bell(987.77,t+0.55,0.1);      // hafif yankı
  };
  ping();
  waitingTimer=setInterval(ping,2200);
}

function setupConn(c, hostSide){
  conn = c;
  let opened = false;

  const handleOpen = () => {
    if (opened) return;
    opened = true;
    stopWaiting();
    _disconnectGuard = false;
    try { c.send({ t: "hello", name: myName }); } catch(e) {}

    if (hostSide) {
      setTimeout(() => { if (conn === c && c.open) hostSetup(); }, 500);
    } else {
      S.found();
    }
  };

  if(c.oppName)oppName=c.oppName;
  c.on("data", d => onData(d));
  c.on("close", () => {
    stopWaiting();
    if (_disconnectGuard) return;
    if (inSetup) { inSetup=false; S.leave(); showDisconnect(); }
    else if (onlineState) { S.leave(); showDisconnect(); }
    else if (postGame) {
      S.leave();addChatSys("Rakip ayrıldı.");
      const b=document.getElementById("again");if(b)b.setAttribute("aria-disabled","true");
      setRmStatus("Rakip ayrıldı. Yeni rakip bulabilir ya da ana menüye dönebilirsin.");
    }
  });
  c.on("error", (err) => {
    console.error("Connection error:", err);
    if (_disconnectGuard) return;
    if (inSetup) { inSetup=false; S.leave(); showDisconnect(); }
    else if (onlineState) { S.leave(); showDisconnect(); }
    else if (postGame) { addChatSys("Bağlantı hatası oluştu."); }
    else { stopWaiting(); destroyPeer(); onlineMenu(); const el = document.getElementById("err"); if (el) el.textContent = "Bağlantı hatası oluştu."; }
  });

  if (c.open) handleOpen();
  else c.on("open", handleOpen);
}

/* MQTT oturumunu başlatır, olayları PeerJS tarzı bir conn nesnesine bağlar */
function mqConn(s){
  const h={data:[],close:[],error:[],open:[]};
  return {
    get open(){return s.matched},
    get peer(){return s.opp},
    send(o){return s.send(o)},
    close(){try{s.close()}catch(e){}},
    on(ev,cb){(h[ev]||(h[ev]=[])).push(cb)},
    _emit(ev,a){(h[ev]||[]).slice().forEach(cb=>{try{cb(a)}catch(e){console.error(e)}})}
  };
}
function mqFail(text){
  stopWaiting();destroyPeer();onlineMenu();
  const el=document.getElementById("err");if(el)el.textContent=text;
  live.textContent=text;
}
function mqNewSession(){
  if(peer){try{peer.destroy()}catch(e){}peer=null;conn=null}
  const s=new MqSession(myName,(ev,d)=>{
    if(peer!==s)return;
    if(ev==="status"){
      const p=st.querySelector(".waiting .muted");if(p)p.textContent=d.text;
      live.textContent=d.text;
    }else if(ev==="room_ready")mqRoomReady(d.code);
    else if(ev==="error")mqFail(d.text);
    else if(ev==="matched"){
      const c=mqConn(s);isHost=(d.role==="host");oppName=d.oppName||"Rakip";c.oppName=oppName;
      setupConn(c,isHost);
    }else if(ev==="msg"){if(conn&&conn._emit)conn._emit("data",d.data)}
    else if(ev==="left"){if(conn&&conn._emit)conn._emit("close")}
  });
  peer=s;return s;
}

function onData(d){
  if(!d||!d.t)return;
  if(d.t==="hello"){oppName=d.name||"Rakip";updatePlayers();return}
  if(d.t==="mic"){micGotId(d.id);return}
  if(d.t==="chat"){addChat(d.name||oppName,d.text,false);S.chatRecv();return}
  if(d.t==="rematch"){
    oppRematch=true;
    if(postGame){
      addChatSys("Rakip rövanş istiyor.");
      if(!myRematch)setRmStatus("Rakip rövanş istiyor. Kabul etmek için Rövanş düğmesine bas.");
    }
    tryRematch();return;
  }
  if(d.t==="setup"&&!isHost){
    if(postGame)S.found();
    guestWait();return;
  }
  if(d.t==="start"&&!isHost){
    if(!d.qs||!d.qs.length)return;
    onlineState=newOnlineState(d.qs,[0,20,30,45].includes(d.qtime)?d.qtime:20);
    beginOnline();
    return;
  }
  if(d.t==="ready"){
    const o=onlineState;if(!o||!Number.isInteger(d.i))return;
    o.oppReady[d.i]=true;
    const note=document.getElementById("nnote");
    if(note&&o.phase==="reveal"&&!o.myReady[d.i]&&d.i===o.round+1)note.textContent="Rakip hazır.";
    tryAdvance();return;
  }
  if(d.t==="ans"){
    const o=onlineState;if(!o||!Number.isInteger(d.i))return;
    const k=Number.isInteger(d.k)&&d.k>=-1&&d.k<4?d.k:-1;
    const ms=Math.min(o.qtime*1000,Math.max(0,+d.ms||0));
    o.opp[d.i]={k,ms};
    if(o.round===d.i&&o.phase==="q"){
      if(o.my[d.i])revealRound(d.i);
      else{setStat("Rakip cevapladı.");live.textContent="Rakip cevapladı."}
    }
    return;
  }
  if(d.t==="extra"){
    const o=onlineState;if(!o||!d.q||!Number.isInteger(d.i))return;
    o.qs[d.i]=d.q;
    tryAdvance();return;
  }
}

/* ===== ONLINE OYUN: eşzamanlı düello ===== */
/* İki oyuncu aynı soruyu aynı anda görür. Her soruda süre vardır; doğru cevap puan,
   hızlı cevap bonus puan getirir. Cevaplar iki taraf da verince birlikte açılır.
   10 soru sonunda puan eşitse altın soru gelir. */
const O_ROUNDS=10,O_QTIME=20,O_BASE=100,O_BONUS=100,O_REVEAL=12;

function newOnlineState(qs,qt){
  return {qs,round:-1,phase:"vs",locked:false,qtime:qt,
    my:{},opp:{},myPts:0,oppPts:0,myCor:0,oppCor:0,hist:[],
    myReady:{},oppReady:{},finished:false,over:false,tie:false,
    tm:null,vsTm:null,rv:null,deadline:0,qStart:0};
}
function clearOnlineTimers(o){
  if(!o)return;
  if(o.tm){clearInterval(o.tm);o.tm=null}
  if(o.vsTm){clearTimeout(o.vsTm);o.vsTm=null}
  if(o.rv){clearInterval(o.rv);o.rv=null}
}
function roundPoints(ok,ms,qtime){
  if(!ok)return 0;
  if(!qtime)return O_BASE;
  return O_BASE+Math.round(O_BONUS*Math.max(0,1-ms/(qtime*1000)));
}
function onlineTimeText(){
  const o=onlineState;if(!o)return"";
  if(!o.qtime)return "Süre sınırı kapalı.";
  if(o.phase==="q"&&!o.locked&&o.tm)return "Kalan süre: "+Math.max(0,Math.ceil((o.deadline-Date.now())/1000))+" saniye.";
  if(o.phase==="q")return "Cevabını verdin, rakip bekleniyor.";
  return "Bu soru için süre durdu.";
}

function beginOnline(){
  const o=onlineState;if(!o)return;
  inSetup=false;postGame=false;myRematch=false;oppRematch=false;
  chatToggle(true);addChatSys("Oyun başladı. İyi şanslar!");
  showVs();
}
function showVs(){

    st.innerHTML=`<div class="vs-screen">

/* Her iki taraf "hazır" deyince tur başlar (eşzamanlama) */
function sendReady(n){
  const o=onlineState;if(!o)return;
  o.myReady[n]=true;
  conn&&conn.open&&conn.send({t:"ready",i:n});
  tryAdvance();
}
function tryAdvance(){
  const o=onlineState;if(!o||o.finished)return;
  const n=o.round+1;
  if(o.phase!=="q"&&o.myReady[n]&&o.oppReady[n]&&o.qs[n])startRound(n);
}

function updatePlayers(){
  const el=document.getElementById("players"),o=onlineState;
  if(!el||!o)return;
  el.innerHTML=`<span class="me">${escapeHtml(myName)}: ${o.myPts}</span><span>${escapeHtml(oppName)}: ${o.oppPts}</span>`;
}
function setStat(t){const e=document.getElementById("stat");if(e)e.textContent=t}

function startRound(n){
  const o=onlineState;if(!o)return;
  clearOnlineTimers(o);
  o.round=n;o.phase="q";o.locked=false;
  const q=o.qs[n],extra=n>=O_ROUNDS;
  if(extra)S.extra();else if(n>0)S.next();
  const ladder=Array.from({length:O_ROUNDS},(_,k)=>`<li class="${k<n?(o.hist[k]&&o.hist[k].ok?"good":"bad"):k===n?"now":""}"></li>`).join("");
  st.innerHTML=`${extra?`<div class="turnbar">Altın soru: eşitlik bozulana kadar</div>`:`<ol class="ladder" aria-hidden="true">${ladder}</ol>`}
  <div class="players" id="players" role="group" aria-label="Puan durumu"></div>
  <div class="meta"><span>${extra?"Altın soru":`Soru ${n+1} / ${O_ROUNDS}`}</span><span>${escapeHtml(q.cat)}</span></div>
  ${o.qtime?`<div class="timer" id="timer" aria-hidden="true"><span class="timer-n" id="timerN">${o.qtime}</span><div class="timer-bar"><i id="timerBar"></i></div></div>`:""}
  <h2 class="q" id="qt" tabindex="-1">${escapeHtml(q.q)}</h2>
  <div class="opts" role="group" aria-labelledby="qt">${q.o.map((x,k)=>`<button class="opt" data-k="${k}"><b>${L[k]}</b><span>${escapeHtml(x.t)}</span></button>`).join("")}</div>
  <div class="fb" id="fb"><p class="stat" id="stat">${o.opp[n]?"Rakip cevapladı.":"Rakip düşünüyor…"}</p></div>`;
  updatePlayers();
  st.querySelectorAll(".opt").forEach(b=>b.onclick=()=>onlinePick(+b.dataset.k));
  playMode(true);
  $("#qt").focus();
  const nEl=$("#timerN"),bar=$("#timerBar"),box=$("#timer");
  o.qStart=Date.now();o.deadline=o.qStart+o.qtime*1000;
  if(!o.qtime)return;
  let lastTick=-1,warned=false;
  o.tm=setInterval(()=>{
    if(onlineState!==o||o.phase!=="q"||o.locked){clearOnlineTimers(o);return}
    const ms=Math.max(0,o.deadline-Date.now()),sec=Math.ceil(ms/1000);
    if(nEl)nEl.textContent=sec;
    if(bar)bar.style.width=(ms/(o.qtime*1000)*100)+"%";
    if(box)box.classList.toggle("low",sec<=5);
    if(sec<=5&&sec>0&&sec!==lastTick){lastTick=sec;S.tick()}
    if(sec===10&&!warned&&o.qtime>10){warned=true;live.textContent="10 saniye kaldı."}
    if(ms<=0)lockAnswer(-1);
  },200);
}

function onlinePick(k){
  const o=onlineState;
  if(!o||o.phase!=="q"||o.locked)return;
  lockAnswer(k);
}
function lockAnswer(k){
  const o=onlineState;
  if(!o||o.phase!=="q"||o.locked)return;
  o.locked=true;
  const i=o.round;
  if(o.tm){clearInterval(o.tm);o.tm=null}
  const ms=k<0?o.qtime*1000:Math.min(o.qtime*1000,Date.now()-o.qStart);
  o.my[i]={k,ms};
  conn&&conn.open&&conn.send({t:"ans",i,k,ms});
  const tn=document.getElementById("timerN"),tb=document.getElementById("timerBar");
  if(tn)tn.textContent=Math.max(0,Math.ceil((o.deadline-Date.now())/1000));
  if(tb)tb.style.width=(Math.max(0,o.deadline-Date.now())/(o.qtime*1000)*100)+"%";
  const b=st.querySelectorAll(".opt");
  b.forEach(x=>x.setAttribute("aria-disabled","true"));
  if(k>=0){b[k].classList.add("lock");S.pick()}
  const waitTxt=o.opp[i]?"":" Rakip bekleniyor.";
  setStat(k>=0?"Cevabın kilitlendi."+waitTxt:"Süre doldu."+waitTxt);
  live.textContent=(k>=0?`${L[k]} şıkkı kilitlendi.`:"Süre doldu.")+waitTxt;
  if(o.opp[i])revealRound(i);
}

function revealRound(i){
  const o=onlineState;
  if(!o||o.phase!=="q"||o.round!==i||!o.my[i]||!o.opp[i])return;
  o.phase="reveal";
  S.beat(2);
  setTimeout(()=>{if(onlineState===o&&o.round===i)renderReveal(i)},1100);
}
function renderReveal(i){
  const o=onlineState;if(!o)return;
  const q=o.qs[i],right=q.o.findIndex(x=>x.c);
  const me=o.my[i],op=o.opp[i];
  const meOk=me.k===right,opOk=op.k===right;
  const meP=roundPoints(meOk,me.ms,o.qtime),opP=roundPoints(opOk,op.ms,o.qtime);
  o.myPts+=meP;o.oppPts+=opP;
  if(meOk)o.myCor++;if(opOk)o.oppCor++;
  o.hist[i]={ok:meOk,oppOk:opOk};
  const last=i>=O_ROUNDS-1;
  o.over=last&&o.myPts!==o.oppPts;
  o.tie=last&&o.myPts===o.oppPts;
  if(o.tie&&isHost){
    try{let ex;for(let t=0;t<30;t++){ex=buildQuestions(1)[0];if(!o.qs.some(x=>x&&x.q===ex.q))break}o.qs[i+1]=ex;conn&&conn.open&&conn.send({t:"extra",i:i+1,q:ex})}catch(e){o.tie=false;o.over=true}
  }
  const b=st.querySelectorAll(".opt");
  b.forEach(x=>x.classList.remove("lock"));
  b[right].classList.add("ok");
  if(me.k>=0&&!meOk)b[me.k].classList.add("no");
  if(op.k>=0&&!opOk)b[op.k].classList.add("opp-no");
  const chip=(k,t)=>{if(k>=0)b[k].querySelector("span").insertAdjacentHTML("beforeend",`<em class="chip">${escapeHtml(t)}</em>`)};
  chip(me.k,"Sen");chip(op.k,oppName);
  meOk?S.ok():S.no();
  updatePlayers();
  const meMsg=meOk?`Doğru! +${meP} puan.`:me.k<0?`Süre doldu. Doğru cevap ${L[right]}: ${q.o[right].t}.`:`Yanlış. Doğru cevap ${L[right]}: ${q.o[right].t}.`;
  const opMsg=`${oppName}: ${op.k<0?"süre doldu":opOk?`doğru, +${opP} puan`:"yanlış"}.`;
  const tail=o.over?"":o.tie?" Skor eşit, altın soru geliyor.":"";
  const label=o.over?"Sonucu gör":o.tie?"Altın soruya geç":"Hazırım";
  $("#fb").innerHTML=`<p id="res" tabindex="-1"><strong>${escapeHtml(meMsg)}</strong> ${escapeHtml(opMsg)} ${escapeHtml(q.e)}${escapeHtml(tail)}</p>
  <p class="note" id="nnote"></p><button class="btn" id="nx">${label}</button>`;
  $("#res").focus();
  live.textContent=`${meMsg} Puan: sen ${o.myPts}, ${oppName} ${o.oppPts}.${tail}`;
  const nx=$("#nx"),note=$("#nnote");
  const go=()=>{
    if(onlineState!==o)return;
    if(o.rv){clearInterval(o.rv);o.rv=null}
    if(o.over){endOnline();return}
    if(o.myReady[i+1])return;
    nx.setAttribute("aria-disabled","true");
    note.textContent=o.oppReady[i+1]?"Başlıyor…":"Rakip bekleniyor…";
    live.textContent=note.textContent;
    sendReady(i+1);
  };
  nx.onclick=go;
  if(!o.over&&!o.qtime)note.textContent="Hazır olduğunda düğmeye bas.";
  if(!o.over&&o.qtime){
    let left=O_REVEAL;
    note.textContent=`Sonraki soru ${left} saniye içinde başlar.`;
    o.rv=setInterval(()=>{
      if(onlineState!==o||o.myReady[i+1]){clearInterval(o.rv);o.rv=null;return}
      left--;
      if(left<=0){go();return}
      note.textContent=o.oppReady[i+1]?`Rakip hazır. ${left} saniye içinde başlar.`:`Sonraki soru ${left} saniye içinde başlar.`;
    },1000);
  }
}

function endOnline(){
  const o=onlineState;
  if(!o||o.finished)return;
  o.finished=true;clearOnlineTimers(o);
  const me=o.myPts,opp=o.oppPts;
  const win=me>opp?"Kazandın!":me<opp?"Kaybettin.":"Berabere!";
  const line=`${o.myCor} doğru – ${o.oppCor} doğru`;
  onlineState=null;
  postGame=true;
  if(me>opp)S.win();
  addChatSys("Oyun bitti. Sohbet açık, rakibine tebrik edebilirsin.");
  st.innerHTML=`<div class="result"><h2 id="rs" tabindex="-1">${win}</h2><p class="muted">Sen – ${escapeHtml(oppName)}</p><p class="score">${me} – ${opp}</p>
  <p class="muted">Doğru sayısı: ${line}.</p>
  <p class="muted" id="rmStatus" role="status">Rakibinle sohbet etmeye devam edebilirsin.</p>
  <div class="actions"><button class="btn" id="again">Rövanş</button><button class="btn ghost" id="newopp">Yeni rakip</button><button class="btn ghost" id="menu">Ana Menü</button></div></div>`;
  $("#again").onclick=requestRematch;$("#newopp").onclick=leaveToNewMatch;$("#menu").onclick=leaveToMenu;
  $("#rs").focus();
  live.textContent=`Puan ${me} – ${opp}. Doğru sayısı: ${line}. Sohbet açık.`;
  if(oppRematch)setRmStatus("Rakip rövanş istiyor. Kabul etmek için Rövanş düğmesine bas.");
}

/* ===== MİKROFON (BETA): rakiple sesli konuşma ===== */
let micStream=null,micCall=null,remoteAudio=null,micPeer=null,micPeerP=null,oppMicId=null,micPending=false;
function setMicUi(open){
  const b=document.getElementById("micBtn");if(!b)return;
  b.setAttribute("aria-pressed",open?"true":"false");
  b.innerHTML='Mikrofon (beta)<span aria-hidden="true">: '+(open?"açık":"kapalı")+'</span>';
}
function playRemote(stream){
  if(!remoteAudio){remoteAudio=new Audio();remoteAudio.autoplay=true}
  remoteAudio.srcObject=stream;
  const p=remoteAudio.play&&remoteAudio.play();if(p&&p.catch)p.catch(()=>{});
}
function onCall(call){
  call.answer(micStream||undefined);
  call.on("stream",s=>{playRemote(s);addChatSys("Rakibin mikrofonu açıldı, sesini duyabilirsin.")});
}
function stopMic(){
  if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}
  try{if(micCall)micCall.close()}catch(e){}
  micCall=null;micPending=false;setMicUi(false);
}
/* Sesli konuşma yalnızca web-web çalışır: ayrı bir PeerJS bağlantısı açılır, kimlikler oyun kanalından değiş tokuş edilir. */
function ensureMicPeer(){
  if(micPeerP)return micPeerP;
  if(typeof Peer==="undefined")return Promise.reject(new Error("PeerJS yok"));
  micPeerP=new Promise((res,rej)=>{
    let p;try{p=new Peer(PEER_CONFIG)}catch(e){return rej(e)}
    const t=setTimeout(()=>{try{p.destroy()}catch(e){}rej(new Error("zaman aşımı"))},10000);
    p.on("open",id=>{clearTimeout(t);micPeer=p;p.on("call",onCall);if(conn&&conn.open)conn.send({t:"mic",id});res(p)});
    p.on("error",e=>{clearTimeout(t);rej(e)});
  });
  micPeerP.catch(()=>{micPeerP=null});
  return micPeerP;
}
function micGotId(id){
  if(typeof id!=="string"||!/^[\w-]{8,80}$/.test(id))return;
  oppMicId=id;
  ensureMicPeer().then(p=>{
    if(micPending&&micStream&&oppMicId){micPending=false;micCall=p.call(oppMicId,micStream);addChatSys("Mikrofonun açık, rakip seni duyuyor.")}
  }).catch(()=>{});
}
async function toggleMic(){
  if(micStream){stopMic();addChatSys("Mikrofonunu kapattın.");live.textContent="Mikrofon kapalı.";return}
  if(!conn||!conn.open){addChatSys("Bağlantı yok.");return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){addChatSys("Bu tarayıcı mikrofonu desteklemiyor.");return}
  try{micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){micStream=null;addChatSys("Mikrofon izni verilmedi.");return}
  setMicUi(true);
  let p;
  try{p=await ensureMicPeer()}catch(e){stopMic();addChatSys("Sesli konuşma başlatılamadı.");return}
  if(!micStream)return;
  if(conn&&conn.open)conn.send({t:"mic",id:p.id});
  if(oppMicId){micCall=p.call(oppMicId,micStream);addChatSys("Mikrofonun açık, rakip seni duyuyor.")}
  else{
    micPending=true;addChatSys("Mikrofonun açık. Rakibin bağlanması bekleniyor…");
    setTimeout(()=>{if(micPending&&micStream&&!oppMicId){micPending=false;addChatSys("Rakibin uygulaması sesli konuşmayı desteklemiyor (masaüstü sürümünde mikrofon yok).")}},7000);
  }
  live.textContent="Mikrofon açık.";
}
$("#micBtn").onclick=toggleMic;

/* ===== SÜRE (isteğe bağlı, yalnızca tek başına mod) ===== */
function stopSoloTimer(){if(G&&G.tm){clearInterval(G.tm);G.tm=null}}
function soloRemaining(){return G&&G.deadline?Math.max(0,Math.ceil((G.deadline-Date.now())/1000)):0}
function timeLeftText(){

}
function startSoloTimer(){

function soloTimeout(){

function soloPick(k){
  if(!G||G.lock)return;const b=st.querySelectorAll(".opt");

  S.pick();S.beat(3);live.textContent=`${L[k]} şıkkı kilitlendi: ${q.o[k].t}. Sonuç bekleniyor.`;

}
function soloReveal(k){
  if(!G) return;
  stopSoloTimer();
  const q=G.qs[G.i],b=st.querySelectorAll(".opt"),right=q.o.findIndex(o=>o.c),good=k===right;
  if(k>=0){b[k].classList.remove("lock");b[k].classList.add(good?"ok":"no")}b[right].classList.add("ok");
  good?S.ok():S.no();
  const last=G.i===9,nextLabel=good?(last?"Sonucu gör":"Sonraki soru"):"Sonucu gör";
  const msg=k<0?`Süre doldu. Doğru cevap ${L[right]}: ${q.o[right].t}.`:good?"Doğru cevap!":`Yanlış. Doğru cevap ${L[right]}: ${q.o[right].t}.`;
  $("#fb").innerHTML=`<p id="res" tabindex="-1"><strong>${escapeHtml(msg)}</strong> ${escapeHtml(q.e)}</p><button class="btn" id="nx">${nextLabel}</button>`;
  $("#res").focus();live.textContent=msg;
  $("#nx").onclick=()=>{if(good&&!last){G.i++;showSolo()}else soloEnd(good?10:G.i)};
}
function soloEnd(n){
  stopSoloTimer();
  const perfect=n===10;perfect?S.win():0;
  const t=perfect?"Hepsini bildin!":n>=7?"Çok iyi!":n>=4?"Fena değil.":"Bir daha dene.";
  st.innerHTML=`<div class="result"><h2 id="rs" tabindex="-1">${t}</h2><p class="score">${n} / 10</p>
  <div class="actions"><button class="btn" id="again">Tekrar oyna</button><button class="btn ghost" id="again2">Ana Menü</button></div>
  <p class="foot"><a href="iletisim.html">Hatalı soru bildir / iletişim</a></p></div>`;
  live.textContent=`${t} 10 sorudan ${n} doğru.`;$("#rs").focus();
  $("#again").onclick=soloSetup;$("#again2").onclick=home;
}

/* ===== KLAVYE ===== */
document.addEventListener("keydown",e=>{
  const inGame=st.querySelector(".opts");if(!inGame||e.ctrlKey||e.metaKey||e.altKey)return;
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
  const key=e.key.toLowerCase();
  if(key.length===1&&"1234".includes(key)){const b=inGame.querySelectorAll(".opt")[+key-1];b&&b.click();return}
  const nav={arrowdown:1,arrowright:1,arrowup:-1,arrowleft:-1}[key];
  if(nav||key==="home"||key==="end"){
    if((G&&G.lock)||(onlineState&&onlineState.locked))return;
    const o=[...inGame.querySelectorAll(".opt")].filter(x=>x.getAttribute("aria-disabled")!=="true");
    if(!o.length)return;e.preventDefault();
    const i=o.indexOf(document.activeElement);
    o[key==="home"?0:key==="end"?o.length-1:i<0?(nav>0?0:o.length-1):(i+nav+o.length)%o.length].focus();
  }
});

/* ===== C TUŞU: SORUYU EKRAN OKUYUCUYA OKU ===== */
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key.toLowerCase()!=="c") return;
  const tag=e.target.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT") return;
  const opts=st.querySelector(".opts");
  if(!opts) return;
  e.preventDefault();
  let qText="", cat="", idxTxt="";
  let qData=null;
  if(G && G.qs && G.qs[G.i]){
    qData=G.qs[G.i]; idxTxt=`Soru ${G.i+1} / 10`;
  } else if(onlineState&&onlineState.qs[onlineState.round]){
    const o=onlineState;qData=o.qs[o.round];
    idxTxt=o.round>=O_ROUNDS?"Altın soru":`Soru ${o.round+1} / ${O_ROUNDS}`;
  }
  if(!qData) return;
  cat=qData.cat||"";
  const right=qData.o.findIndex(o=>o.c);
  const optsText=qData.o.map((o,k)=>`${L[k]}: ${escapeHtml(o.t)}`).join(", ");
  qText=`${idxTxt}. Kategori: ${cat}. Soru: ${qData.q}. Seçenekler: ${optsText}.`+((G&&G.limit&&G.tm)||(onlineState&&onlineState.qtime&&onlineState.phase==="q"&&!onlineState.locked)?" "+timeLeftText():"");
  live.textContent=qText;
  // Ayrıca görünür bir canlı bölgeye de yaz
  const el=document.getElementById("live");
  if(el){ el.textContent=""; setTimeout(()=>{el.textContent=qText},50); }
  // Ekran okuyucu için soruyu yeniden odakla
  const qt=document.getElementById("qt");
  if(qt) qt.focus();
});

/* ===== T TUŞU: kalan süre, P TUŞU: puan durumu ===== */
function scoreText(){
  if(G&&G.qs)return `Soru ${G.i+1} / 10. Şu ana kadar ${G.i} doğru.`;
  const o=onlineState;
  if(o)return `Puan: sen ${o.myPts}, ${oppName} ${o.oppPts}. Sen ${o.myCor} soru bildin.`;
  return "";
}
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key.toLowerCase();
  if(k!=="t"&&k!=="p") return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if(!st.querySelector(".opts")) return;
  e.preventDefault();
  const t=k==="t"?timeLeftText():scoreText();
  live.textContent="";setTimeout(()=>{live.textContent=t},50);
});

window.addEventListener("beforeunload",()=>{stopWaiting();destroyPeer()});
load().finally(()=>{ if(POOL.length>=10) home(); });
</script>
